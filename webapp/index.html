<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chat</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #ffffff;
            --bg-secondary: #f0f0f0;
            --text: #000000;
            --text-secondary: #666666;
            --user-bubble: #0088cc;
            --user-text: #ffffff;
            --bot-bubble: #e8e8e8;
            --bot-text: #000000;
            --input-bg: #f0f0f0;
            --border: #d0d0d0;
            --accent: #0088cc;
        }

        .tg-dark {
            --bg: #1a1a2e;
            --bg-secondary: #16213e;
            --text: #eaeaea;
            --text-secondary: #a0a0a0;
            --user-bubble: #0088cc;
            --user-text: #ffffff;
            --bot-bubble: #2a2a4a;
            --bot-text: #eaeaea;
            --input-bg: #2a2a4a;
            --border: #3a3a5a;
            --accent: #0088cc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            padding: 12px 16px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .header select {
            flex: 1;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 14px;
        }

        /* Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            line-height: 1.4;
            font-size: 15px;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-bubble);
            color: var(--user-text);
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: var(--bot-bubble);
            color: var(--bot-text);
            border-bottom-left-radius: 4px;
        }

        .message.error {
            align-self: center;
            background: #ff4444;
            color: white;
            font-size: 13px;
            max-width: 90%;
        }

        .message.bot.typing::after {
            content: '';
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--bot-text);
            margin-left: 4px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Welcome */
        .welcome {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .welcome h2 { margin-bottom: 8px; color: var(--text); }

        /* Input */
        .input-area {
            padding: 12px 16px;
            background: var(--bg);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .input-area textarea {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            resize: none;
            outline: none;
            max-height: 120px;
            min-height: 42px;
            line-height: 1.4;
        }

        .input-area textarea::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: opacity 0.2s;
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Scrollbar */
        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        /* Markdown-like formatting */
        .message code {
            background: rgba(0,0,0,0.1);
            padding: 1px 4px;
            border-radius: 3px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 13px;
        }

        .tg-dark .message code {
            background: rgba(255,255,255,0.1);
        }

        .message pre {
            background: rgba(0,0,0,0.08);
            padding: 8px 12px;
            border-radius: 6px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 13px;
            overflow-x: auto;
            margin: 6px 0;
            white-space: pre-wrap;
        }

        .tg-dark .message pre {
            background: rgba(255,255,255,0.08);
        }

        .message p {
            margin: 0 0 8px 0;
        }

        .message p:last-child {
            margin-bottom: 0;
        }

        .message b {
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="header">
        <select id="modelSelect"></select>
    </div>

    <div class="messages" id="messages">
        <div class="welcome">
            <h2>AI Chat</h2>
            <p>Выберите модель и начните общаться</p>
        </div>
    </div>

    <div class="input-area">
        <textarea id="input" placeholder="Сообщение..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn">&#10148;</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const modelSelect = document.getElementById('modelSelect');

        // История по моделям: { "model-name": [{role, content}, ...] }
        const chatHistories = {};
        const MAX_HISTORY = 5; // 5 пар user+assistant
        let isWaiting = false;
        let currentModel = '';

        // --- Init Telegram ---
        tg.ready();
        tg.expand();

        // Тема
        if (tg.colorScheme === 'dark') {
            document.body.classList.add('tg-dark');
        }

        // Данные пользователя
        const user = tg.initDataUnsafe?.user;
        const userId = user?.id || 0;

        // --- Models ---
        async function loadModels() {
            try {
                const resp = await fetch('/api/models');
                const data = await resp.json();
                modelSelect.innerHTML = '';
                data.models.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m;
                    opt.textContent = m;
                    if (m === data.default) opt.selected = true;
                    modelSelect.appendChild(opt);
                });
                currentModel = data.default;
                // Инициализируем историю для каждой модели
                data.models.forEach(m => {
                    if (!chatHistories[m]) chatHistories[m] = [];
                });
            } catch (e) {
                console.error('Failed to load models:', e);
            }
        }

        function getHistory() {
            if (!chatHistories[currentModel]) chatHistories[currentModel] = [];
            return chatHistories[currentModel];
        }

        modelSelect.addEventListener('change', () => {
            currentModel = modelSelect.value;
            renderMessages();
        });

        // --- Messages ---
        function clearWelcome() {
            const welcome = messagesEl.querySelector('.welcome');
            if (welcome) welcome.remove();
        }

        function formatText(text) {
            let s = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            s = s.replace(/```([\s\S]*?)```/g, '<pre>$1</pre>');
            s = s.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
            s = s.split(/\n{2,}/).map(p => {
                return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
            }).join('');
            return s;
        }

        function addMessageToDOM(role, text) {
            clearWelcome();
            const div = document.createElement('div');
            div.className = `message ${role}`;
            if (role.includes('bot')) {
                div.innerHTML = formatText(text);
            } else {
                div.textContent = text;
            }
            messagesEl.appendChild(div);
            return div;
        }

        function renderMessages() {
            messagesEl.innerHTML = '';
            const history = getHistory();
            if (history.length === 0) {
                messagesEl.innerHTML = '<div class="welcome"><h2>AI Chat</h2><p>Выберите модель и начните общаться</p></div>';
                return;
            }
            history.forEach(msg => addMessageToDOM(msg.role === 'assistant' ? 'bot' : msg.role, msg.content));
            scrollToBottom();
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // --- Send ---
        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || isWaiting) return;

            isWaiting = true;
            sendBtn.disabled = true;
            inputEl.value = '';
            autoResize();

            const history = getHistory();
            addMessageToDOM('user', text);
            history.push({ role: 'user', content: text });

            // HIGH #6: Ограничиваем: MAX_HISTORY пар (2*MAX_HISTORY сообщений)
            while (history.length > MAX_HISTORY * 2) {
                history.shift();
                history.shift();
            }

            const botDiv = addMessageToDOM('bot', '');
            let fullReply = '';
            let streamAborted = false;

            // HIGH #7: AbortController для отмены стрима при ошибке
            const controller = new AbortController();

            try {
                const resp = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: history,
                        model: currentModel,
                    }),
                    signal: controller.signal,
                });

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (!streamAborted) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        try {
                            const data = JSON.parse(line.slice(6));
                            if (data.error) {
                                botDiv.className = 'message error';
                                botDiv.textContent = data.error;
                                history.pop();
                                streamAborted = true;
                                controller.abort();
                                break;
                            }
                            if (data.token) {
                                fullReply += data.token;
                                botDiv.innerHTML = formatText(fullReply);
                                scrollToBottom();
                            }
                            if (data.done) {
                                history.push({ role: 'assistant', content: fullReply });
                            }
                        } catch (e) {}
                    }
                }
            } catch (e) {
                if (e.name !== 'AbortError') {
                    botDiv.className = 'message error';
                    botDiv.textContent = 'Ошибка сети. Попробуйте ещё раз.';
                    history.pop();
                }
            }

            isWaiting = false;
            sendBtn.disabled = false;
            inputEl.focus();
            scrollToBottom();
        }

        // --- Input ---
        sendBtn.addEventListener('click', sendMessage);

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function autoResize() {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
        }

        inputEl.addEventListener('input', autoResize);

        // --- Init ---
        loadModels();
        inputEl.focus();
    </script>
</body>
</html>
